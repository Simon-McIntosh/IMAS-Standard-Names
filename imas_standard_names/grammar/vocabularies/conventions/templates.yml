# One description opening and one documentation opening per name pattern.
#
# A pattern key is written in grammar segments: a base plus the segment kinds
# the name fills (e.g. base ``density`` with the ``subject`` segment filled).
# The pattern is selected from the parse, never from a text search.
#
# The section order of the documentation body and the generic sign-convention
# form stay in ``specification.yml`` (``entry_schema.fields.documentation``);
# a template references them rather than restating them.
#
# Every documentation opens with a defining noun phrase of the same shape as
# its description, so the two openings of a pattern are the same text. A
# template with no segments applies to every name with its base; one with
# segments applies where the name fills them, and an opening need only follow
# one selected template.
#
# Placeholders, written in braces, are filled from the name:
#   {subject} {object} {component} {coordinate} {qualifier} {zone} {aggregation}
#   {population}  the words of that segment, in reading order
#   {modifiers}   the words the name places before its base, in reading order
#   {locus}       the of, at, over or due-to clause as the name carries it
#   {operator}    the operator phrase, ending in "of" where English needs it
# The opening check reads a template as a pattern with each placeholder a
# wildcard, so its literal text holds no pattern metacharacters.
templates:

  - base: density
    segments:
      - subject
    description: 'Number density of {subject}'
    documentation: 'Number density of {subject}'

  - base: number_density
    description: '{modifiers} number density {locus}'
    documentation: '{modifiers} number density {locus}'

  - base: temperature
    segments:
      - subject
    description: 'Temperature of {subject} {locus}'
    documentation: 'Temperature of {subject} {locus}'

  - base: temperature
    segments:
      - object
    description: 'Temperature of {object}'
    documentation: 'Temperature of {object}'

  - base: temperature
