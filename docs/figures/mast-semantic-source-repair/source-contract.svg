<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Standard Name semantic and source contract</title>
  <desc id="desc">DD paths and MAST facility signals are provenance sources. They attach to a stable Standard Name in the graph, which is projected to an ISNC release candidate and re-queried by Nova.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#30363d"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#30363d;stroke-width:1.5;rx:10}
      .source{fill:#ddf4ff;stroke:#0969da}
      .name{fill:#dafbe1;stroke:#1a7f37;stroke-width:2}
      .release{fill:#fff8c5;stroke:#9a6700}
      .blocked{fill:#ffebe9;stroke:#cf222e}
      .line{stroke:#30363d;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .h{font:600 17px system-ui,sans-serif;fill:#1f2328}
      .t{font:14px system-ui,sans-serif;fill:#1f2328}
      .s{font:12px system-ui,sans-serif;fill:#57606a}
    </style>
  </defs>

  <rect class="box source" x="25" y="35" width="230" height="105"/>
  <text class="h" x="45" y="68">DD source</text>
  <text class="t" x="45" y="94">path + DD version</text>
  <text class="t" x="45" y="118">definition + COCOS metadata</text>

  <rect class="box source" x="25" y="220" width="230" height="105"/>
  <text class="h" x="45" y="253">MAST signal source</text>
  <text class="t" x="45" y="279">facility + signal + shot range</text>
  <text class="t" x="45" y="303">experimental provenance</text>

  <path class="line" d="M255 88 C335 88 340 145 395 160"/>
  <path class="line" d="M255 272 C335 272 340 215 395 200"/>

  <rect class="box name" x="395" y="105" width="290" height="150"/>
  <text class="h" x="420" y="140">Standard Name</text>
  <text class="t" x="420" y="170">one stable semantic identity</text>
  <text class="t" x="420" y="196">description, unit, grammar, stage</text>
  <text class="s" x="420" y="224">sources realize the name; they do not rename it</text>

  <path class="line" d="M685 180 H750"/>
  <rect class="box release" x="750" y="105" width="315" height="150"/>
  <text class="h" x="775" y="140">ISNC release candidate</text>
  <text class="t" x="775" y="170">stable id + complete sources</text>
  <text class="t" x="775" y="196">strict ISN validation</text>
  <text class="s" x="775" y="224">publication waits for explicit authority</text>

  <rect class="box blocked" x="750" y="285" width="315" height="50"/>
  <text class="t" x="775" y="316">No authority now: plan, audit and dry-run only</text>
</svg>
